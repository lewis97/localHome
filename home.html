
<!DOCTYPE html>
<html lang="en">
<head>
    <!-- // Redirect to the flame server if it is running: -->
  <script src="./scripts/server-check-redirect.js" type="text/javascript"></script>
  <meta charset="UTF-8">
  <title>LocalHome Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px;
    }
    h1 {
      margin-bottom: 30px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 20px;
      width: 80%;
      max-width: 800px;
    }
    .card {
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      text-decoration: none;
      color: #e2e8f0;
      transition: 0.2s;
    }
    .card:hover {
      background: #334155;
    }
  </style>
</head>
<body>

<h1>PLACEHOLDER Home</h1>
<p>v0.1</p>

<div class="grid">
  <a class="card" href="http://home.home">🏠 Server</a>
  <a class="card" href="http://192.168.1.10:3000">Flame</a>
  <a class="card" href="https://google.com">Google</a>
  <a class="card" href="https://github.com">GitHub</a>
</div>

</body>
</html>
